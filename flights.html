<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICPS 2028 Delhi - Interactive IAPS Travel Map</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://unpkg.com/topojson-client@3"></script>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(22, 30, 46, 0.85);
      --accent-color: #00f2fe;
      --accent-orange: #ff9900;
      --text-main: #f0f4f8;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 12px 24px;
      background: rgba(11, 15, 25, 0.9);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #ffffff;
    }

    header span {
      font-size: 0.85rem;
      color: var(--accent-color);
      background: rgba(0, 242, 254, 0.1);
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid rgba(0, 242, 254, 0.2);
    }

    #map-container {
      flex: 1;
      width: 100%;
      position: relative;
      cursor: default; /* Changed from grab to standard arrow */
    }

    .country {
      fill: #1e293b;
      stroke: #334155;
      stroke-width: 0.6px;
      transition: all 0.25s ease;
    }

    .country:hover {
      fill: #3b82f6;
      stroke: #60a5fa;
      stroke-width: 1.2px;
      cursor: default; /* Changed from pointer to standard arrow */
    }

    .country.has-data {
      fill: #1e3a8a;
    }

    .country.has-data:hover {
      fill: #2563eb;
    }

    .country.india {
      fill: #14532d !important;
      stroke: #22c55e !important;
      stroke-width: 1px !important;
      stroke-linejoin: round;
    }

    .flight-arc {
      fill: none;
      stroke: var(--accent-orange);
      stroke-width: 2px;
      stroke-linecap: round;
      stroke-dasharray: 6 4;
      animation: dash 1.5s linear infinite;
    }

    @keyframes dash {
      to { stroke-dashoffset: -20; }
    }

    .delhi-marker {
      fill: #ef4444;
      stroke: #ffffff;
      stroke-width: 1.5px;
    }

    .delhi-pulse {
      fill: rgba(239, 68, 68, 0.4);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { r: 4px; opacity: 1; }
      100% { r: 18px; opacity: 0; }
    }

    /* Fixed Bottom Bar */
    #info-bar {
      height: 90px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.4);
      z-index: 10;
    }

    .bar-section {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .flag {
      font-size: 2.5rem;
      line-height: 1;
    }
    
    .flag-img {
      width: 48px;
      height: auto;
      border-radius: 4px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      display: none; /* hidden until hovered */
    }

    .country-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #ffffff;
    }

    .country-sub {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .info-group {
      display: flex;
      gap: 32px;
    }

    .info-item {
      display: flex;
      flex-direction: column;
    }

    .info-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .info-value {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .highlight-val {
      color: var(--accent-color);
    }
  </style>
</head>

      <img src="" id="val-flag-img" class="flag-img" alt="Flag" />
      <div>

    <div class="info-group" id="data-items" style="display: none;">

      "IRL": { name: "Ireland", iso2: "ie", capital: "Dublin", visa: "e-Visa", visaFee: "€23 ($25 USD)", flight: "€650 - €850", time: "11 - 13 hrs", lat: 53.1424, lon: -7.6921 },
      "ROU": { name: "Romania", iso2: "ro", capital: "Bucharest", visa: "e-Visa", visaFee: "€23 ($25 USD)", flight: "€600 - €800", time: "9 - 11 hrs", lat: 45.9432, lon: 24.9668 },
      "UKR": { name: "Ukraine", iso2: "ua", capital: "Kyiv", visa: "e-Visa", visaFee: "€23 ($25 USD)", flight: "€700 - €900", time: "12 - 16 hrs", lat: 48.3794, lon: 31.1656 },
      "MLT": { name: "Malta", iso2: "mt", capital: "Valletta", visa: "e-Visa", visaFee: "€23 ($25 USD)", flight: "€650 - €850", time: "10 - 13 hrs", lat: 35.9375, lon: 14.3754 },
      "SVN": { name: "Slovenia", iso2: "si", capital: "Ljubljana", visa: "e-Visa", visaFee: "€23 ($25 USD)", flight: "€600 - €800", time: "10 - 12 hrs", lat: 46.1512, lon: 14.9955 }

    const delhiCoords = [77.2090, 28.6139]; 

    const container = d3.select("#map-container");
    const width = container.node().getBoundingClientRect().width;
    const height = container.node().getBoundingClientRect().height;

    const svg = container.append("svg")
      .attr("width", "100%")
      .attr("height", "100%")
      .attr("viewBox", `0 0 ${width} ${height}`);

    const g = svg.append("g");

    const projection = d3.geoMercator()
      .scale(width / 6.5)
      .translate([width / 2.2, height / 1.5]);

    const path = d3.geoPath().projection(projection);

    const countriesGroup = g.append("g").attr("id", "countries");
    const routeGroup = g.append("g").attr("id", "routes");
    const markerGroup = g.append("g").attr("id", "markers");

    // Delhi Pin
    const delhiPos = projection(delhiCoords);
    
    markerGroup.append("circle")
      .attr("cx", delhiPos[0])
      .attr("cy", delhiPos[1])
      .attr("class", "delhi-pulse");

    markerGroup.append("circle")
      .attr("cx", delhiPos[0])
      .attr("cy", delhiPos[1])
      .attr("r", 5)
      .attr("class", "delhi-marker");

    markerGroup.append("text")
      .attr("x", delhiPos[0] + 8)
      .attr("y", delhiPos[1] + 4)
      .text("Delhi (DEL)")
      .attr("fill", "#ffffff")
      .attr("font-size", "11px")
      .attr("font-weight", "bold");

    // Load standard world map and official Survey of India boundary simultaneously 
    Promise.all([
      d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json"),
      d3.json("https://raw.githubusercontent.com/datameet/maps/master/Country/india-composite.geojson")
    ]).then(([worldTopo, indiaGeo]) => {
      
      // Extract standard countries
      let countries = topojson.feature(worldTopo, worldTopo.objects.countries).features;

      // Filter out the standard UN/De-facto India boundary (ISO 356)
      countries = countries.filter(d => d.id !== "356");

      // Inject Official India Boundary DataMeet GeoJSON
      const indiaFeatures = indiaGeo.type === "FeatureCollection" ? indiaGeo.features : [indiaGeo];
      indiaFeatures.forEach(f => {
        f.id = "356"; 
        f.properties = f.properties || {};
        f.properties.name = "India";
        countries.push(f);
      });

      // Render map
      countriesGroup.selectAll("path")
        .data(countries)
        .enter()
        .append("path")
        .attr("d", path)
        .attr("class", d => {
          if (d.id === "356") return "country india";
          const numericToAlpha3 = { "124":"CAN","032":"ARG","040":"AUT","398":"KAZ","288":"GHA","840":"USA","188":"CRI","191":"HRV","410":"KOR","504":"MAR","484":"MEX","320":"GTM","203":"CZE","608":"PHL","788":"TUN","340":"HND","208":"DNK","702":"SGP","858":"URY","070":"BIH","158":"TWN","120":"CMR","246":"FIN","792":"TUR","218":"ECU","250":"FRA","214":"DOM","268":"GEO","031":"AZE","604":"PER","276":"DEU","364":"IRN","300":"GRC","376":"ISR","348":"HUN","524":"NPL","380":"ITA","643":"RUS","807":"MKD","422":"LBN","499":"MNE","528":"NLD","578":"NOR","616":"POL","620":"PRT","688":"SRB","724":"ESP","756":"CHE","826":"GBR","372":"IRL","642":"ROU","804":"UKR","470":"MLT","705":"SVN" };
          const alpha3 = numericToAlpha3[d.id];
          return alpha3 && memberData[alpha3] ? "country has-data" : "country";
        })
        .on("mouseover", (event, d) => {
          const numericToAlpha3 = { "124":"CAN","032":"ARG","040":"AUT","398":"KAZ","288":"GHA","840":"USA","188":"CRI","191":"HRV","410":"KOR","504":"MAR","484":"MEX","320":"GTM","203":"CZE","608":"PHL","788":"TUN","340":"HND","208":"DNK","702":"SGP","858":"URY","070":"BIH","158":"TWN","120":"CMR","246":"FIN","792":"TUR","218":"ECU","250":"FRA","214":"DOM","268":"GEO","031":"AZE","604":"PER","276":"DEU","364":"IRN","300":"GRC","376":"ISR","348":"HUN","524":"NPL","380":"ITA","643":"RUS","807":"MKD","422":"LBN","499":"MNE","528":"NLD","578":"NOR","616":"POL","620":"PRT","688":"SRB","724":"ESP","756":"CHE","826":"GBR","372":"IRL","642":"ROU","804":"UKR","470":"MLT","705":"SVN" };
          const alpha3 = numericToAlpha3[d.id];
          if (alpha3 && memberData[alpha3]) {
            drawFlightRoute(memberData[alpha3]);
            updateInfoBar(memberData[alpha3]);
          }
        })
        .on("mouseout", () => {
          clearFlightRoute();
          resetInfoBar();
        });
    }).catch(error => {
      console.error("Error loading map assets:", error);
    });

    // Flight Route Generator
    function drawFlightRoute(data) {
      clearFlightRoute();
      
      const originPos = projection([data.lon, data.lat]);
      const destPos = projection(delhiCoords);

      const dx = destPos[0] - originPos[0];
      const dy = destPos[1] - originPos[1];
      const cx = originPos[0] + dx / 2 - dy * 0.25;
      const cy = originPos[1] + dy / 2 + dx * 0.25;

      const pathData = `M ${originPos[0]},${originPos[1]} Q ${cx},${cy} ${destPos[0]},${destPos[1]}`;

      routeGroup.append("path")
        .attr("d", pathData)
        .attr("class", "flight-arc");

      routeGroup.append("circle")
        .attr("cx", originPos[0])
        .attr("cy", originPos[1])
        .attr("r", 4)
        .attr("fill", "#00f2fe");
    }

    function clearFlightRoute() {
      routeGroup.selectAll("*").remove();
    }

    // Interactive Bottom Bar with proper Flag images
    function updateInfoBar(data) {
      d3.select("#val-flag-emoji").style("display", "none");
      d3.select("#val-flag-img")
        .style("display", "block")
        .attr("src", `https://flagcdn.com/w80/${data.iso2}.png`)
        .attr("alt", `${data.name} Flag`);

      d3.select("#val-name").text(data.name);
      d3.select("#val-sub").text("IAPS Member Territory");
      d3.select("#val-capital").text(data.capital);
      d3.select("#val-visa").text(data.visa);
      d3.select("#val-visa-fee").text(data.visaFee);
      d3.select("#val-flight").text(data.flight);
      d3.select("#val-time").text(data.time);

      d3.select("#data-items").style("display", "flex");
    }

    function resetInfoBar() {
      d3.select("#val-flag-emoji").style("display", "block");
      d3.select("#val-flag-img").style("display", "none");
      d3.select("#val-name").text("Hover over a highlighted member country");
      d3.select("#val-sub").text("View roundtrip airfare baseline, duration, and visa requirements to Delhi");
      
      d3.select("#data-items").style("display", "none");
    }

    const zoom = d3.zoom()
      .scaleExtent([1, 8])
      .on("zoom", (event) => g.attr("transform", event.transform));

    svg.call(zoom);
  </script>
</body>
</html>
